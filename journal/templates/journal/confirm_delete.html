<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Confirm Delete</title>
</head>

<body>
    <h2>Delete Entry</h2>
    <p>Are you sure you want to delete "<strong>{{ entry.title }}</strong>"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'my_entries' %}">Cancel</a>
    </form>
</body>

</html>
