{% extends "tracker/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2>Login</h2>
      <form method="post" novalidate>
        {% csrf_token %}

        <div class="mb-3">
          <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
          <input type="text" name="{{ form.username.name }}" class="form-control" id="{{ form.username.id_for_label }}" value="{{ form.username.value }}">
          {% if form.username.errors %}
            <div class="text-danger small">{{ form.username.errors.0 }}</div>
          {% endif %}
        </div>

        <div class="mb-3">
          <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
          <input type="password" name="{{ form.password.name }}" class="form-control" id="{{ form.password.id_for_label }}">
          {% if form.password.errors %}
            <div class="text-danger small">{{ form.password.errors.0 }}</div>
          {% endif %}
        </div>

        <button type="submit" class="btn btn-primary">Log In</button>
      </form>
    </div>
  </div>
{% endblock %}
