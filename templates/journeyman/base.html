<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Journeyman{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styles -->
    <style></style>
</head>
<body>

    <!-- Header -->
    <header>JOURNEYMAN</header>

    <!-- Navbar -->
    {% if user.is_authenticated %}
    <nav class="d-flex gap-2 justify-content-center mb-4 flex-wrap">
        <a href="{% url 'my_entries' %}" class="btn navbar-btn">My Entries</a>
        <a href="{% url 'create_entry' %}" class="btn navbar-btn">New Entry</a>
        <a href="{% url 'public_entries' %}" class="btn navbar-btn">Public Entries</a>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn logout-btn">Log Out</button>
        </form>
    </nav>
    {% endif %}

    <!-- Page Content -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
